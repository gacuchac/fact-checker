[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fact-checker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2", "pyyaml", "anthropic", "openai", "python-dotenv", "fastapi", "uvicorn[standard]", "httpx"]

[project.scripts]
fc = "fact_checker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fact_checker.services" = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: builds the index from data/corpus.json in a tmp dir"]
