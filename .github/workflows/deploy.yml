name: deploy

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: fact-checker / production
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Check the deploy token
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::Add a Railway project token for the production environment as the RAILWAY_TOKEN secret of the 'fact-checker / production' GitHub environment."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the Railway CLI
        run: npm install --global @railway/cli@5.71.0
      - name: Build and deploy on Railway
        run: railway up --ci --service web --environment production
